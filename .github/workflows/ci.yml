name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/core/go.mod
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: services/core
      - run: go test -race ./...

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/core/go.mod
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      - run: supabase start
      - run: supabase db reset
      - run: supabase test db
      - run: go test -race -tags=integration ./internal/availability/adapters/postgres ./internal/coverage/adapters/postgres ./internal/bootstrap
        working-directory: services/core
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm oxlint
      - run: pnpm -C apps/mobile lint
      - run: pnpm -C apps/mobile typecheck
      - run: pnpm -C apps/mobile test --ci

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: make py-lint
      - run: make py-test
